    for (const k of SCENES) if (k !== key && (game.scene.isActive(k) || game.scene.isPaused(k) || game.scene.isSleeping(k))) game.scene.stop(k);
    game.scene.start(key, data);
  };
  var editor = null;
  var editorFor = (game) => {
    if (editor) return editor;
    const builtins = RAW_TECHNIQUES.filter((t) => validateTechnique(t).length === 0);
    const ed = new DevEditor({
      builtins,
      manifest: MANIFEST3,
      onTest: (technique, pack, progressionCount) => {
        const embedded = {
          technique,
          pack,
          progressionCount,
          onEvent: ed.onEngineEvent,
          onExit: () => {
            ed.setRunning(false);
            switchScene(game, "editor");
          }
        };
        void loadFonts(glyphsIn(technique.name, technique.phases.map((p) => p.label ?? "").join("")), 1200).then(() => switchScene(game, "game", { embedded }));
      },
      onStop: () => switchScene(game, "editor"),
      onExit: () => {
        ed.unmount();
        switchScene(game, "title");
      }
    });
    editor = ed;
    return ed;
  };
  var EditorScene = class extends phaser_global_default.Scene {
    constructor() {
      super("editor");
    }
    preload() {
      preloadCharacterSprites(this);
    }
    create() {
      const ed = editorFor(this.game);
      ed.mount();
      ed.setRunning(false);
      window.__aikidoEditor = ed;
      drawDojo(this);
      addCharacterSprite(this, STAGE_CENTER_X - 28, FLOOR_Y, CHARACTER_TEXTURES.player).setDepth(10);
      addCharacterSprite(this, STAGE_CENTER_X + 28, FLOOR_Y, CHARACTER_TEXTURES.enemy).setDepth(11).setFlipX(true);
      const font = (size, color) => ({ fontFamily: FONT_FAMILY, fontSize: `${size}px`, color, stroke: "#000000", strokeThickness: 3 });
      this.add.text(GAME_WIDTH / 2, 24, EDITOR_STRINGS[0], { ...font(16, "#7da8ff"), fontStyle: "bold" }).setOrigin(0.5);
      this.add.text(GAME_WIDTH / 2, 150, EDITOR_STRINGS[1], font(12, "#fff4c2")).setOrigin(0.5);
      this.add.text(GAME_WIDTH / 2, 170, EDITOR_STRINGS[2], font(10, "#9aa0b8")).setOrigin(0.5);
      this.cameras.main.fadeIn(150, 0, 0, 0);
    }
  };

  // src/main.ts
  var boot = async () => {
    const saved = loadPack()?.techniques ?? [];
    await loadFonts(glyphsIn(JSON.stringify(RAW_TECHNIQUES), JSON.stringify(saved), ...UI_STRINGS, ...EDITOR_STRINGS));
    const game = new phaser_global_default.Game(createGameConfig([TitleScene, GameScene, EditorScene], "game"));
    installIntegerZoom(game);
  };
  void boot();
})();

</script>
</body>
</html>
